services:
  - type: web
    name: multitenant-rag
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn multiTenantrag:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
